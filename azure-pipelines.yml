trigger:
  branches:
    include:
      - main

pool:
  name: Default  # Your self-hosted Windows agent

variables:
  serviceConnection: 'IaC'
  backendResourceGroup: 'VSP-TCH'
  backendStorageAccount: 'vesperstorage'
  backendContainer: 'tfstate'
  backendKey: 'terraform.tfstate'
  environment: 'dev'

  # --- GLOBAL ENVIRONMENT BYPASSES ---
  TF_SKIP_CHECKPOINT: 'true'
  CHECKPOINT_DISABLE: '1'
  GIT_SSL_NO_VERIFY: 'true'
  TF_PROXY_FROM_ENV: 'true' # Tells Terraform to respect the Windows Trusted Root Store

stages:

# ----------------------------------------------------------
# STAGE 1 — TERRAFORM INIT
# ----------------------------------------------------------
  - stage: Terraform_Init
    displayName: "Terraform Init"
    jobs:
      - job: init
        steps:
          - checkout: self

          - script: |
              terraform version
            displayName: "Verify Terraform Installed"

          - task: AzureCLI@2
            displayName: "Export Certs & Terraform Init"
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Export the local Windows Root CA store to a PEM bundle for Terraform's Go engine
                Get-ChildItem Cert:\LocalMachine\Root | 
                    ForEach-Object { 
                        "#[$_]"
                        [System.Convert]::ToBase64String($_.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert), 'InsertLineBreaks')
                    } > "$(System.DefaultWorkingDirectory)\agent_certs.pem"
                
                $env:SSL_CERT_FILE="$(System.DefaultWorkingDirectory)\agent_certs.pem"
                $env:CURL_CA_BUNDLE="$(System.DefaultWorkingDirectory)\agent_certs.pem"
                
                terraform init `
                  -backend-config="resource_group_name=$(backendResourceGroup)" `
                  -backend-config="storage_account_name=$(backendStorageAccount)" `
                  -backend-config="container_name=$(backendContainer)" `
                  -backend-config="key=$(backendKey)"
                
# ----------------------------------------------------------
# STAGE 2 — TERRAFORM PLAN
# ----------------------------------------------------------
  - stage: Terraform_Plan
    displayName: "Terraform Plan"
    dependsOn: Terraform_Init
    condition: succeeded()
    jobs:
      - job: plan
        steps:
          - checkout: self
          
          - task: AzureCLI@2
            displayName: "Terraform Init & Plan"
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Get-ChildItem Cert:\LocalMachine\Root | ForEach-Object { "#[$_]"; [System.Convert]::ToBase64String($_.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert), 'InsertLineBreaks') } > "$(System.DefaultWorkingDirectory)\agent_certs.pem"
                $env:SSL_CERT_FILE="$(System.DefaultWorkingDirectory)\agent_certs.pem"
                $env:CURL_CA_BUNDLE="$(System.DefaultWorkingDirectory)\agent_certs.pem"

                terraform init `
                  -backend-config="resource_group_name=$(backendResourceGroup)" `
                  -backend-config="storage_account_name=$(backendStorageAccount)" `
                  -backend-config="container_name=$(backendContainer)" `
                  -backend-config="key=$(backendKey)"
                
                terraform plan -out="$(System.DefaultWorkingDirectory)\tfplan"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Plan Artifact"
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)\tfplan'
              artifact: 'tfplan'
              publishLocation: 'pipeline'

# ----------------------------------------------------------
# STAGE 3 — TERRAFORM APPLY
# ----------------------------------------------------------
  - stage: Terraform_Apply
    displayName: "Terraform Apply"
    dependsOn: Terraform_Plan
    condition: succeeded()
    jobs:
      - job: apply
        steps:
          - checkout: self

          - download: current
            artifact: tfplan

          - task: AzureCLI@2
            displayName: "Terraform Init & Apply"
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'ps'
              scriptLocation: 'inlineScript'
              inlineScript: |
                Get-ChildItem Cert:\LocalMachine\Root | ForEach-Object { "#[$_]"; [System.Convert]::ToBase64String($_.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert), 'InsertLineBreaks') } > "$(System.DefaultWorkingDirectory)\agent_certs.pem"
                $env:SSL_CERT_FILE="$(System.DefaultWorkingDirectory)\agent_certs.pem"
                $env:CURL_CA_BUNDLE="$(System.DefaultWorkingDirectory)\agent_certs.pem"

                terraform init `
                  -backend-config="resource_group_name=$(backendResourceGroup)" `
                  -backend-config="storage_account_name=$(backendStorageAccount)" `
                  -backend-config="container_name=$(backendContainer)" `
                  -backend-config="key=$(backendKey)"
                
                terraform apply -auto-approve "$(Pipeline.Workspace)\tfplan\tfplan"