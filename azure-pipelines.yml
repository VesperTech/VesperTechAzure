trigger:
  branches:
    include:
      - main

pool:
  name: Default  # Your self-hosted Windows agent

variables:
  serviceConnection: 'IaC'
  backendResourceGroup: 'VSP-TCH'
  backendStorageAccount: 'vesperstorage'
  backendContainer: 'tfstate'
  backendKey: 'terraform.tfstate'
  environment: 'dev'
  TF_SKIP_CHECKPOINT: 'true'
  CHECKPOINT_DISABLE: '1'

stages:

# ----------------------------------------------------------
# STAGE 1 — TERRAFORM INIT
# ----------------------------------------------------------
  - stage: Terraform_Init
    displayName: "Terraform Init"
    jobs:
      - job: init
        steps:
          - checkout: self

          - script: |
              terraform version
            displayName: "Verify Terraform Installed"

          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'
                
# ----------------------------------------------------------
# STAGE 2 — TERRAFORM PLAN
# ----------------------------------------------------------
  - stage: Terraform_Plan
    displayName: "Terraform Plan"
    dependsOn: Terraform_Init
    condition: succeeded()
    jobs:
      - job: plan
        steps:
          - checkout: self
          
          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTask@5
            displayName: "Terraform Plan"
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: '$(serviceConnection)' #  Fixed connection name
              commandOptions: '-out=$(System.DefaultWorkingDirectory)/tfplan'

          - task: PublishPipelineArtifact@1
            displayName: "Publish Plan Artifact"
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/tfplan'
              artifact: 'tfplan'
              publishLocation: 'pipeline'

# ----------------------------------------------------------
# STAGE 3 — TERRAFORM APPLY
# ----------------------------------------------------------
  - stage: Terraform_Apply
    displayName: "Terraform Apply"
    dependsOn: Terraform_Plan
    condition: succeeded()
    jobs:
      - job: apply
        steps:
          - checkout: self

          - download: current
            artifact: tfplan

          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: '$(serviceConnection)' #  Uses connection context automatically
              commandOptions: '$(Pipeline.Workspace)/tfplan/tfplan'